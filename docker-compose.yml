services:
  postgres:
    image: postgres:16-alpine
    container_name: lunar_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lunar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lunar-app:
    build: .
    container_name: lunar_boutique
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/lunar_db"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
