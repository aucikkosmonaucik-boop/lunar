name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK Release
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Asset
        run: |
          mkdir -p mobile/build/app/outputs/flutter-apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/app/outputs/flutter-apk/lunar-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mobile-app
          path: mobile/build/app/outputs/flutter-apk/lunar-app.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lunar Mobile App (Latest Release)"
          body: |
            ## 🌙 Lunar Store Mobile App (Android .APK)
            
            Official Android release for Lunar Store (`https://mylunar.shop`).
            
            ### 📱 How to Install:
            1. Download **`lunar-app.apk`** below to your Android device.
            2. Open the downloaded file from your notifications or browser downloads.
            3. If prompted by Android security, tap **Settings** and enable **"Allow from this source"**.
            4. Tap **Install** and open the app.
          draft: false
          prerelease: false
          make_latest: true
          files: mobile/build/app/outputs/flutter-apk/lunar-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
