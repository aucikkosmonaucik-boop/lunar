name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Make Gradlew Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build APK Release
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee ../build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: build.log

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          echo "=== Scanning for APK files ==="
          find . -name "*.apk" || true
          APK_FILE=$(find . -path "*/outputs/*" -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found anywhere in workspace!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/lunar-app.apk
          ls -lh build-output/lunar-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-mobile-app
          path: build-output/lunar-app.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lunar Mobile App (Latest Release)"
          body: |
            ## 🌙 Lunar Store Mobile App (Android .APK)
            
            Official Android release for Lunar Store (`https://mylunar.shop`).
            
            ### 📱 How to Install:
            1. Download **`lunar-app.apk`** below to your Android device.
            2. Open the downloaded file from your notifications or browser downloads.
            3. If prompted by Android security, tap **Settings** and enable **"Allow from this source"**.
            4. Tap **Install** and open the app.
          draft: false
          prerelease: false
          make_latest: true
          files: build-output/lunar-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
