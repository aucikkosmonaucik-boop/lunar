    <!-- Google Consent Mode v2 (Default Denied until user consent) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Check existing consent from localStorage
      var savedConsent = null;
      try {
        var raw = localStorage.getItem('lunar_cookie_consent_v1');
        if (raw) savedConsent = JSON.parse(raw);
      } catch (e) {}

      if (savedConsent && savedConsent.hasConsented) {
        gtag('consent', 'default', {
          'analytics_storage': savedConsent.preferences.analytics ? 'granted' : 'denied',
          'ad_storage': savedConsent.preferences.marketing ? 'granted' : 'denied',
          'ad_user_data': savedConsent.preferences.marketing ? 'granted' : 'denied',
          'ad_personalization': savedConsent.preferences.marketing ? 'granted' : 'denied'
        });
      } else {
        gtag('consent', 'default', {
          'analytics_storage': 'denied',
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied',
          'wait_for_update': 500
        });
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K3S2WN3RY6"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-K3S2WN3RY6', {
        send_page_view: true
      });
    </script>
