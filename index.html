<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/moon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lunar — Discover luxury perfumes and fine jewelry handcrafted with elegance and distinction." />
    <meta name="keywords" content="perfumes, jewelry, luxury, lunar, shop, biżuteria, perfumy, luxury jewelry, gold, silver" />
    <meta name="author" content="Lunar" />
    <link rel="canonical" href="https://mylunar.shop/" />

    <!-- Googlebot & Search Engine Crawlers -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook / Google -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mylunar.shop/" />
    <meta property="og:title" content="Lunar | Luxury Perfumes & Jewelry" />
    <meta property="og:description" content="Discover luxury perfumes and fine jewelry handcrafted with elegance and distinction." />
    <meta property="og:image" content="https://mylunar.shop/moon.svg" />
    <meta property="og:site_name" content="Lunar" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mylunar.shop/" />
    <meta name="twitter:title" content="Lunar | Luxury Perfumes & Jewelry" />
    <meta name="twitter:description" content="Discover luxury perfumes and fine jewelry handcrafted with elegance and distinction." />
    <meta name="twitter:image" content="https://mylunar.shop/moon.svg" />

    <!-- Schema.org JSON-LD for Googlebot Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://mylunar.shop/#organization",
          "name": "Lunar",
          "url": "https://mylunar.shop/",
          "logo": "https://mylunar.shop/moon.svg",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "contact@mylunar.shop",
            "contactType": "customer service"
          },
          "sameAs": [
            "https://www.instagram.com/mylunar.ie",
            "https://x.com/allkeys4games"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://mylunar.shop/#website",
          "url": "https://mylunar.shop/",
          "name": "Lunar",
          "description": "Discover luxury perfumes and fine jewelry.",
          "publisher": {
            "@id": "https://mylunar.shop/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://mylunar.shop/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Store",
          "@id": "https://mylunar.shop/#store",
          "name": "Lunar Boutique",
          "url": "https://mylunar.shop/",
          "image": "https://mylunar.shop/moon.svg",
          "description": "Luxury perfumes and fine jewelry collections.",
          "priceRange": "$$"
        }
      ]
    }
    </script>

    <title>Lunar | Luxury Perfumes & Jewelry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
